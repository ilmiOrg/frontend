name: CI

on:
  push:
    branches: [master, "claude/**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test --watchAll=false

      - name: Build
        run: yarn build
